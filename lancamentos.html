<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lançamento de Serviços Extras</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="mobile-shell">
    <!-- TELA DE LOGIN EXCLUSIVA PARA AUTORIZADOS -->
    <section id="login-view" class="mobile-card" style="margin-top: 28px;">
      <div style="text-align: center; margin-bottom: 20px;">
        <div style="display:inline-flex; width:52px; height:52px; border-radius:14px; background:#eff6ff; color:#1e40af; align-items:center; justify-content:center; font-weight:800; font-size:1.3rem; margin-bottom:10px;">
          SE
        </div>
        <h1 style="font-size: 1.25rem; font-weight: 800; color: #0f172a;">Lançamento de Serviços Extras</h1>
        <p style="font-size: 0.88rem; color: #475569; margin-top: 4px;">Acesso exclusivo para solicitantes autorizados</p>
      </div>

      <form id="form-login" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="login-user">Login</label>
          <input type="text" id="login-user" class="form-control" placeholder="Digite seu usuário" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label class="form-label" for="login-pass">Senha</label>
          <input type="password" id="login-pass" class="form-control" placeholder="Digite sua senha" required autocomplete="current-password" />
        </div>
        <div id="login-error" class="toast-feedback error hidden" style="margin-bottom: 12px;"></div>
        <button type="submit" class="btn-salvar-unico" style="background: #1e40af;">ENTRAR</button>
      </form>
    </section>

    <!-- TELA EXCLUSIVA DE LANÇAMENTOS (6 CAMPOS + CADASTRO RÁPIDO DE COLABORADOR + BOTÃO SALVAR LANÇAMENTO) -->
    <section id="lancamento-view" class="hidden">
      <header class="mobile-header">
        <div>
          <h1>Novo Serviço Extra</h1>
          <div style="font-size: 0.78rem; opacity: 0.92;">Solicitante logado: <strong id="usuario-logado-nome">-</strong></div>
        </div>
        <button type="button" id="btn-sair" class="btn-logout-mini" title="Trocar usuário">Sair</button>
      </header>

      <div id="feedback-lancamento" class="toast-feedback hidden" style="margin-bottom: 14px;"></div>

      <form id="form-lancamento" class="mobile-card">
        <!-- 1. Nome do colaborador (+ opção de cadastrar novo colaborador) -->
        <div class="form-group">
          <div class="form-label-row">
            <label class="form-label" for="campo-colaborador">
              <span class="step-num">1</span>Nome do colaborador
            </label>
            <button type="button" id="btn-abrir-novo-colab" class="btn-inline-add">+ Novo Colaborador</button>
          </div>

          <select id="campo-colaborador" class="form-control" required></select>
          <span id="info-cargo-colaborador" class="helper-badge auto hidden"></span>

          <!-- Mini-painel para cadastrar novo colaborador direto pelo celular -->
          <div id="box-novo-colaborador" class="quick-add-box hidden">
            <div style="font-size: 0.82rem; font-weight: 800; color: #1e40af; margin-bottom: 8px;">
              Cadastrar Novo Colaborador
            </div>
            <div style="margin-bottom: 8px;">
              <input type="text" id="novo-colab-nome" class="form-control" placeholder="Nome completo do colaborador" style="padding: 10px 12px;" />
            </div>
            <div style="margin-bottom: 10px;">
              <select id="novo-colab-cargo" class="form-control" style="padding: 10px 12px;"></select>
            </div>
            <div style="display: flex; gap: 8px;">
              <button type="button" id="btn-confirmar-novo-colab" class="btn btn-primary btn-sm" style="flex: 1;">
                Confirmar Cadastro
              </button>
              <button type="button" id="btn-cancelar-novo-colab" class="btn btn-outline btn-sm">
                Cancelar
              </button>
            </div>
          </div>
        </div>

        <!-- 2. Empresa onde trabalhou -->
        <div class="form-group">
          <label class="form-label" for="campo-empresa">
            <span class="step-num">2</span>Empresa onde trabalhou
          </label>
          <select id="campo-empresa" class="form-control" required></select>
        </div>

        <!-- 3. Data do trabalho -->
        <div class="form-group">
          <label class="form-label" for="campo-data">
            <span class="step-num">3</span>Data do trabalho
          </label>
          <input type="date" id="campo-data" class="form-control" required />
        </div>

        <!-- 4. Turno: manhã, tarde ou noite -->
        <div class="form-group">
          <label class="form-label">
            <span class="step-num">4</span>Turno
          </label>
          <div class="turno-grid">
            <div class="turno-option">
              <input type="radio" name="turno" id="turno-manha" value="Manhã" required />
              <label for="turno-manha">Manhã</label>
            </div>
            <div class="turno-option">
              <input type="radio" name="turno" id="turno-tarde" value="Tarde" />
              <label for="turno-tarde">Tarde</label>
            </div>
            <div class="turno-option">
              <input type="radio" name="turno" id="turno-noite" value="Noite" />
              <label for="turno-noite">Noite</label>
            </div>
          </div>
        </div>

        <!-- 5. Motivo da solicitação -->
        <div class="form-group">
          <label class="form-label" for="campo-motivo">
            <span class="step-num">5</span>Motivo da solicitação
          </label>
          <input type="text" id="campo-motivo" class="form-control" placeholder="Ex: Cobertura de folga, evento extra..." required />
        </div>

        <!-- 6. Valor do serviço (automático pela tabela Empresa + Cargo, mas editável) -->
        <div class="form-group">
          <label class="form-label" for="campo-valor">
            <span class="step-num">6</span>Valor do serviço (R$)
          </label>
          <input type="number" id="campo-valor" class="form-control" step="0.01" min="0.01" placeholder="0,00" required />
          <span id="info-valor-badge" class="helper-badge">Selecione o colaborador e a empresa para preencher automaticamente.</span>
        </div>

        <!-- Botão único principal: SALVAR LANÇAMENTO -->
        <button type="submit" id="btn-salvar-lancamento" class="btn-salvar-unico">
          SALVAR LANÇAMENTO
        </button>
      </form>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/lancamentos.js"></script>
</body>
</html>
